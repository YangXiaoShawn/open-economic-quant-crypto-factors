[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "crypto-factors"
version = "0.1.0"
description = "Cross-market transfer of equity microstructure factors and perpetual-futures positioning signals in crypto"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yang Xiao" }]
dependencies = [
  "ccxt>=4.2",
  "matplotlib>=3.8",
  "numpy>=1.26",
  # Shared monorepo package, pinned by commit so this project installs standalone;
  # inside the monorepo, uv uses the workspace copy (root tool.uv.sources).
  "oeq-core @ git+https://github.com/YangXiaoShawn/open-economic-quant@3d309b7e90ca7b970bb5396d3bb781c92de4ea7e#subdirectory=packages/oeq-core",
  "pandas>=2.1",
  "pyarrow>=15.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
crypto-factors = "crypto_factors.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_factors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/crypto_factors"]
